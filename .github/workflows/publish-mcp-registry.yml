name: Publish MCP Registry entry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC proves ownership of the io.github.motherduckdb namespace

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        working-directory: mcp-registry
        run: ../mcp-publisher validate

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        working-directory: mcp-registry
        run: ../mcp-publisher publish
