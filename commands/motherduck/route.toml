description = "Map a MotherDuck task onto the right skill or skill sequence."

prompt = """
Route this task onto the installed MotherDuck skill catalog: {{args}}

Required behavior:
- Recommend the best single skill or ordered skill sequence.
- Start with the matching capability; add connection setup or discovery only when context is missing. End-to-end work can start directly with a use-case skill.
- Prefer `motherduck-cli` for coding agents editing Dive/Flight files or handling large output; prefer MCP for chat-only exploration and inline results.
- Business-semantic MCP queries require `get_query_guide`; add `motherduck-manage-guides` when Guide reading or maintenance needs its detailed workflow.
- If a use-case skill applies and a remote MotherDuck MCP server or local MotherDuck server is likely active, say what live workspace or schema details should be inspected first.
- Keep the answer short and actionable.

Output format:
1. Recommended skill or sequence
2. Why
3. First concrete next step
"""
